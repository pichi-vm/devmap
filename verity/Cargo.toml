[package]
name = "devmap-verity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
description = "Streaming dm-verity formatting and authenticated reads."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["dm-verity", "verity", "device-mapper", "hash-tree", "cryptsetup"]
categories = ["filesystem", "cryptography"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sha2"]
tokio = ["dep:tokio", "devmap-core/tokio"]
sha1 = ["dep:sha1", "dep:digest"]
sha2 = ["dep:sha2", "dep:digest"]
sha3 = ["dep:sha3", "dep:digest"]
ripemd = ["dep:ripemd", "dep:digest"]
whirlpool = ["dep:whirlpool", "dep:digest"]
streebog = ["dep:streebog", "dep:digest"]
sm3 = ["dep:sm3", "dep:digest"]
blake2 = ["dep:blake2", "dep:digest"]

[dependencies]
devmap-core = { version = "0.1.0", path = "../core" }
blake2 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }
ripemd = { version = "0.1", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
sm3 = { version = "0.4", optional = true }
streebog = { version = "0.10", optional = true }
whirlpool = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
hex = "0.4"
tempfile = "3"

[[test]]
name = "api"
required-features = ["sha2"]

[[test]]
name = "async"
required-features = ["tokio", "sha2"]

[[test]]
name = "async_metadata"
required-features = ["tokio"]

[[test]]
name = "veritysetup"
required-features = ["sha2"]

[lints]
workspace = true
