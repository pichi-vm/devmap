[package]
name = "devmap-verity"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
readme = "README.md"
description = "dm-verity metadata, streaming formatting, and Linux target descriptions."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["dm-verity", "verity", "device-mapper", "hash-tree", "cryptsetup"]
categories = ["filesystem", "cryptography"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
tokio = ["dep:tokio"]
sha1 = ["dep:sha1", "dep:digest"]
sha2 = ["dep:sha2", "dep:digest-next"]
sha3 = ["dep:sha3", "dep:digest-next"]
ripemd = ["dep:ripemd", "dep:digest-next"]
whirlpool = ["dep:whirlpool", "dep:digest"]
streebog = ["dep:streebog", "dep:digest"]
sm3 = ["dep:sm3", "dep:digest"]
blake2 = ["dep:blake2", "dep:digest-next"]

[dependencies]
devmap-core = { version = "0.1.0", path = "../core" }
blake2 = { version = "0.11", optional = true }
digest = { version = "0.10", optional = true }
digest-next = { package = "digest", version = "0.11", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
ripemd = { version = "0.2", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
sha3 = { version = "0.12", optional = true }
sm3 = { version = "0.5", optional = true }
streebog = { version = "0.10", optional = true }
whirlpool = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
devmap-linux = { version = "0.1.0", path = "../linux" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lodown = { git = "https://github.com/pichi-vm/lodown", rev = "2492c468cc7968c512aa4f3f58220ab36d6424b3" }

[[test]]
name = "format"
required-features = ["sha2"]

[[test]]
name = "activate"
required-features = ["sha2"]

[[test]]
name = "async_format"
required-features = ["tokio", "sha2"]

[lints]
workspace = true
