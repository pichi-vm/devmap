name: security

on:
  # Pull request branches are checked through pull_request, so they do not run twice.
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/security.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

# A newer update to the same pull request stops the older run.
# Every other run (main pushes, scheduled and manual runs) gets its own
# group so it is never stopped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories
        run: cargo audit
