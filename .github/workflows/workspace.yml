name: workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install reference tools
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup-bin jq ripgrep
      - run: bash scripts/check-dependencies.sh
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-features --all-targets
      - run: cargo test --workspace --no-default-features --all-targets
      - run: cargo test --workspace --all-features --doc
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify packaged workspace
        run: |
          package_check_dir=$(mktemp -d)
          cargo package --workspace --all-features --target-dir "$package_check_dir"
      - name: Independent target crates
        run: |
          for crate in core crypt snapshot zero; do
            cargo test -p "devmap-$crate" --no-default-features --all-targets
            cargo test -p "devmap-$crate" --all-features --all-targets
          done
          cargo test -p devmap-verity --no-default-features --all-targets
          cargo test -p devmap-luks --no-default-features --test io
          cargo test -p devmap-luks --no-default-features --features devmap-crypt --test io
  kernel:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup-bin dmsetup jq
      - name: Enable device-mapper
        run: sudo modprobe dm_mod
      - run: bash scripts/test-kernel.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check declared minimum Rust versions
        run: |
          for crate in core crypt snapshot verity zero; do
            cargo check -p "devmap-$crate" --all-features --all-targets
          done
