name: workspace

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install reference tools
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup-bin jq
      - name: Verify dependency boundaries
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --all-features)
          jq -e '
            .packages as $packages |
            ($packages | map({key: .name, value: .}) | from_entries) as $by_name |
            def normal_deps($name):
              [$by_name[$name].dependencies[]? | select(.kind != "dev") | .name];
            (($packages | map(.name) | sort) ==
             (["devmap-core", "devmap-linux", "devmap-verity"] | sort)) and
            all($packages[].targets[]; (.kind | index("bin")) == null) and
            ([normal_deps("devmap-core")[] | select(startswith("devmap-"))] == []) and
            all(["devmap-linux", "devmap-verity"][];
                any($by_name[.].dependencies[]?;
                    .name == "devmap-core" and .kind == null and .optional == false)) and
            any($by_name["devmap-verity"].dependencies[]?;
                .name == "devmap-linux" and .kind == null and .optional == false and
                .target == "cfg(target_os = \"linux\")") and
            ([normal_deps("devmap-linux")[] | select(startswith("devmap-"))] == ["devmap-core"])
          ' <<< "$metadata"

          tree=$(cargo tree -p devmap-verity --no-default-features --edges normal --prefix none)
          grep -q '^devmap-core v' <<< "$tree"
          grep -q '^devmap-linux v' <<< "$tree"
          if grep -E '^(tokio|digest|sha1|sha2|sha3|ripemd|whirlpool|streebog|sm3|blake2) v' <<< "$tree"; then
            echo 'verity minimal build contains an unexpected hashing dependency' >&2
            exit 1
          fi

          test -e linux/src/target/crypt.rs
          test -e linux/src/target/snapshot.rs
          test -e linux/src/target/zero.rs
          unsafe_files=$(grep -rlE 'unsafe[[:space:]]*\{' core/src linux/src verity/src | sort)
          expected_files=$(printf '%s\n' core/src/detect.rs linux/src/abi/uapi.rs)
          test "$unsafe_files" = "$expected_files"
      - name: Format
        run: cargo fmt --all --check
      - name: Test all features and targets
        run: cargo test --workspace --all-features --all-targets
      - name: Test minimum features and targets
        run: cargo test --workspace --no-default-features --all-targets
      - name: Test documentation
        run: |
          cargo test --workspace --all-features --doc
          cargo test --workspace --no-default-features --doc
      - name: Test verity features independently
        run: |
          cargo test -p devmap-verity --no-default-features --features tokio --all-targets
          cargo test -p devmap-verity --no-default-features --features tokio --doc
          for feature in blake2 ripemd sha1 sha2 sha3 sm3 streebog whirlpool; do
            cargo test -p devmap-verity --no-default-features --features "$feature" --all-targets
          done
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify packaged workspace
        run: |
          package_dir=$(mktemp -d)
          cargo package --workspace --all-features --target-dir "$package_dir"

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install kernel test tools
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup-bin dmsetup jq kmod
      - name: Provision and verify device-mapper and loop devices
        run: |
          sudo modprobe dm_mod
          sudo modprobe loop
          sudo modprobe dm_zero
          sudo modprobe dm_crypt
          sudo modprobe dm_snapshot
          sudo modprobe dm_verity

          # The module may be loaded without device nodes in a fresh runner.
          sudo mkdir -p /dev/mapper
          if ! test -c /dev/mapper/control; then
            sudo mknod -m 600 /dev/mapper/control c 10 236
          fi
          if ! test -c /dev/loop-control; then
            sudo mknod -m 600 /dev/loop-control c 10 237
          fi
          for number in $(seq 0 15); do
            if ! test -b "/dev/loop$number"; then
              sudo mknod -m 660 "/dev/loop$number" b 7 "$number"
            fi
          done

          sudo dmsetup version
          sudo losetup -f
          available_targets=$(sudo dmsetup targets)
          for target in crypt snapshot snapshot-origin snapshot-merge verity zero; do
            grep -q "^$target " <<< "$available_targets"
          done
          veritysetup --version
      - name: Compile every test binary
        run: |
          cargo test --workspace --all-features --all-targets --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            | sort -u > "$RUNNER_TEMP/test-binaries"
          test -s "$RUNNER_TEMP/test-binaries"
      - name: Run all tests, including ignored tests, against the kernel
        run: |
          while IFS= read -r executable; do
            echo "Running $executable"
            sudo "$executable" --include-ignored --test-threads=1
          done < "$RUNNER_TEMP/test-binaries"

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check library minimum Rust versions
        run: cargo check --workspace --all-features --lib
