name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --target-dir "$RUNNER_TEMP/devmap-docs"
        env:
          RUSTDOCFLAGS: --cfg docsrs
      - name: redirect root to crate
        run: echo '<meta http-equiv="refresh" content="0; url=devmap_core/index.html">' > "$RUNNER_TEMP/devmap-docs/doc/index.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/devmap-docs/doc

  deploy:
    name: deploy to pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
