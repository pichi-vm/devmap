[package]
name = "devmap-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Safe, typed Linux device-mapper ioctl interface."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
readme = "README.md"
keywords = ["linux", "device-mapper", "dm", "ioctl", "block-device"]
categories = ["os::unix-apis", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
devmap-core = { version = "0.1.0", path = "../core" }
iocuddle = "0.4"
zerocopy = { version = "0.8", features = ["derive"] }

# Tests only: a safe `poll()` wrapper, so the DM_DEV_ARM_POLL coverage can
# wait on the control fd without this crate or its tests writing unsafe.
[dev-dependencies]
tempfile = "3"
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[lints]
workspace = true
