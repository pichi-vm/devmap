# The devmap repo root is the `devmap` CLI. The workspace members are the
# libraries it drives, each in a directory named without the `devmap-`
# prefix (the prefix is implied here and only carried in the published
# crate name). `core/` holds shared storage and device-mapper interfaces;
# `linux/` implements the device-mapper backend. Each target's owning crate
# supplies its `dm` module and any on-disk format or userspace I/O APIs.
[package]
name = "devmap"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line front-end for the Linux device-mapper."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"

[dependencies]
devmap-crypt = { version = "0.1.0", path = "crypt" }
devmap-delay = { version = "0.1.0", path = "delay" }
devmap-dust = { version = "0.1.0", path = "dust" }
devmap-era = { version = "0.1.0", path = "era" }
devmap-error = { version = "0.1.0", path = "error" }
devmap-flakey = { version = "0.1.0", path = "flakey" }
devmap-integrity = { version = "0.1.0", path = "integrity" }
devmap-linear = { version = "0.1.0", path = "linear" }
devmap-log-writes = { version = "0.1.0", path = "log-writes" }
devmap-raid = { version = "0.1.0", path = "raid" }
devmap-striped = { version = "0.1.0", path = "striped" }
devmap-thin = { version = "0.1.0", path = "thin" }
devmap-thin-pool = { version = "0.1.0", path = "thin-pool" }
devmap-unstriped = { version = "0.1.0", path = "unstriped" }
devmap-writecache = { version = "0.1.0", path = "writecache" }
devmap-zero = { version = "0.1.0", path = "zero" }
devmap-core = { version = "0.1.0", path = "core" }
devmap-linux = { version = "0.1.0", path = "linux" }
devmap-verity = { version = "0.1.0", path = "verity" }
devmap-zoned = { version = "0.1.0", path = "zoned" }
devmap-snapshot = { version = "0.1.0", path = "snapshot" }
devmap-luks = { version = "0.1.0", path = "luks", features = ["devmap-crypt"] }
devmap-persistent = { version = "0.1.0", path = "persistent" }
clap = { version = "4", features = ["derive"] }
# Master keys go into the kernel keyring; this is a safe wrapper, so the
# workspace-wide `unsafe_code = "deny"` still holds.
keyutils = "0.4"
# Passphrase entry without terminal echo.
rpassword = "7"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# Tests only: the root gate (Control::open) for the CLI integration test.
[dev-dependencies]
devmap-linux = { version = "0.1.0", path = "linux" }
tempfile = "3"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["core", "linux", "verity", "zoned", "snapshot", "luks", "persistent", "crypt", "delay", "dust", "era", "error", "flakey", "integrity", "linear", "log-writes", "raid", "striped", "thin", "thin-pool", "unstriped", "writecache", "zero"]

# Shared lints for every member. Kept here so a new member picks them up
# with `[lints] workspace = true` rather than duplicating the block.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
