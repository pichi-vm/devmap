# Shared storage, format, and Linux device-mapper libraries.
[workspace]
resolver = "3"
members = ["core", "linux", "snapshot", "verity"]

# Shared lints for every member. Kept here so a new member picks them up
# with `[lints] workspace = true` rather than duplicating the block.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Keep a module's code in foo/mod.rs, not in foo.rs beside foo/.
self_named_module_files = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
