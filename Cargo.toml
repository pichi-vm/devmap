[package]
name = "devmap"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/devmap"
publish = false
description = "High-level, iocuddle-based Linux device-mapper ioctl layer."

[dependencies]
iocuddle = { path = "/home/nathaniel/Projects/iocuddle" }
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
