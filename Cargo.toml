# Shared storage, format, and Linux device-mapper libraries.
[workspace]
resolver = "3"
members = ["core", "crypt", "linux", "luks", "snapshot", "verity", "zero"]

# Shared lints for every member. Kept here so a new member picks them up
# with `[lints] workspace = true` rather than duplicating the block.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
