[package]
name = "devmap-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Shared block-device traits and I/O adapters for devmap format crates."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["block-device", "storage", "io", "device-mapper"]
categories = ["filesystem"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
futures-io = { version = "0.3", optional = true }

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true
