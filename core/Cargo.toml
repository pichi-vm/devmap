[package]
name = "devmap-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
description = "Shared block-storage geometry and block-size types."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["device-mapper", "storage", "block-device"]
categories = ["filesystem"]

[target.'cfg(target_os = "linux")'.dependencies]
iocuddle = "0.3"

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
