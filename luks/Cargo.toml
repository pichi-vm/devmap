[package]
name = "devmap-luks"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reader and writer for the LUKS1 and LUKS2 on-disk formats (a pure-Rust cryptsetup)."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["luks", "luks2", "cryptsetup", "dm-crypt", "encryption"]
categories = ["filesystem", "cryptography"]

[dependencies]
# LUKS2 metadata is JSON; large integers are encoded as JSON strings.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Key derivation: LUKS2 keyslots use argon2, LUKS1 and LUKS2 digests PBKDF2.
argon2 = "0.5"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Keyslot areas are stored encrypted, by default aes-xts-plain64.
aes = "0.8"
xts-mode = "0.5"
base64 = "0.22"
# Key material must not linger in freed memory.
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
