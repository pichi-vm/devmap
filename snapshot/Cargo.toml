[package]
name = "devmap-snapshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
description = "A seekable copy-on-write layer using the dm-snapshot persistent COW format."
repository = "https://github.com/pichi-vm/devmap"
homepage = "https://github.com/pichi-vm/devmap"
keywords = ["dm-snapshot", "snapshot", "device-mapper", "copy-on-write", "cow"]
categories = ["filesystem"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devmap-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
devmap-zero = { version = "0.1.0", path = "../zero", features = ["tokio"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }
tempfile = "3"

[features]
tokio = ["dep:tokio", "devmap-core/tokio"]

[[test]]
name = "async"
required-features = ["tokio"]

[lints]
workspace = true
